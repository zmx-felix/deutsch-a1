<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f1e6">
<title>德语 A1 语法 · 自学手册</title>
<style>
  :root{
    --paper:#f6f1e6; --card:#fffdf8; --ink:#1d2420; --muted:#66716a; --faint:#9aa39d;
    --line:#e2dac9; --deep:#123f31; --gold:#e8a90c; --ok:#2f855a; --no:#b23a3a;
    --blue:#2b6cb0; --red:#b23a3a; --green:#2f855a;
    --shadow:0 1px 2px rgba(29,36,32,.05), 0 12px 28px -22px rgba(29,36,32,.55);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
    font-size:15px;line-height:1.62;-webkit-font-smoothing:antialiased}
  .sans{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif}
  .de{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-style:italic}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em;
    background:#efe8d8;color:#4a4235;padding:1px 5px;border-radius:4px;white-space:normal;overflow-wrap:anywhere}

  header{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,#123f31,#0f3529);color:#fff;
    padding:10px 14px 0;box-shadow:0 6px 18px -14px rgba(0,0,0,.8)}
  .hrow{display:flex;align-items:center;gap:10px}
  .brand{font-weight:600;font-size:14px;text-decoration:none;color:#fff}
  .brand i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-right:7px;vertical-align:1px}
  .back{margin-left:auto;font-size:12.5px;color:#c9dcd1;text-decoration:none;padding:4px 8px;border:1px solid rgba(255,255,255,.18);border-radius:7px}
  .toc{display:flex;gap:6px;overflow-x:auto;padding:9px 0 10px;scrollbar-width:none}
  .toc::-webkit-scrollbar{display:none}
  .toc a{flex:0 0 auto;font-size:12px;color:#cfe0d6;text-decoration:none;border:1px solid rgba(255,255,255,.16);
    border-radius:8px;padding:4px 9px;white-space:nowrap}
  .toc a.on{background:rgba(232,169,12,.16);border-color:rgba(232,169,12,.5);color:#f3c96a}
  .toc a.done{border-color:rgba(120,200,150,.5);color:#a8e0bd}

  main{max-width:820px;margin:0 auto;padding:18px 14px 100px}
  .hero h1{margin:0 0 4px;font-size:24px;letter-spacing:.01em}
  .hero p{margin:0;color:var(--muted);font-size:13.5px}
  .prog{display:flex;align-items:center;gap:10px;margin:14px 0 0}
  .bar{flex:1;height:7px;background:#e7dfcd;border-radius:99px;overflow:hidden}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2f855a,#7fb069);transition:width .3s}
  .prog b{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}

  .tools{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 12px;font-size:13px;box-shadow:var(--shadow);cursor:pointer}
  .btn.sm{padding:5px 10px;font-size:12px}
  .search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px;font-size:14px;margin:12px 0 0}

  section.ch{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 16px 10px;
    margin-top:16px;box-shadow:var(--shadow);scroll-margin-top:96px}
  section.ch.hide{display:none}
  .chead{display:flex;align-items:flex-start;gap:10px;cursor:pointer;user-select:none}
  .num{flex:0 0 auto;width:30px;height:30px;border-radius:9px;background:var(--deep);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
  .ct{flex:1;min-width:0}
  .ct h2{margin:0;font-size:17.5px;line-height:1.35}
  .ct .sub{font-size:12px;color:var(--faint);margin-top:1px}
  .mark{flex:0 0 auto;font-size:11px;border:1px solid var(--line);background:#fbf7ec;color:var(--muted);
    border-radius:7px;padding:4px 8px;white-space:nowrap}
  .mark.on{background:#eaf5ee;border-color:#a9d8bd;color:#1f6b46;font-weight:600}
  .cbody{padding-top:12px}
  section.ch.collapsed .cbody{display:none}

  .cbody h3{font-size:14px;margin:16px 0 6px;color:var(--deep);letter-spacing:.02em}
  .cbody h3:first-child{margin-top:2px}
  .cbody p{margin:8px 0;font-size:14px;color:#39413b;overflow-wrap:break-word}
  .cbody p .de, .cbody p code{font-style:normal}

  table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13.2px;display:block;overflow-x:auto}
  th,td{border:1px solid #e7dfcd;padding:6px 9px;text-align:left;vertical-align:top}
  th{background:#f1e9d8;font-weight:600;color:#4a4235;font-size:12.5px}
  td{background:#fffdf8}
  td:first-child{font-weight:500;color:#4a4235}

  .exs{margin:10px 0;border-left:3px solid #d9cfb8;padding-left:12px}
  .exs .row2{padding:5px 0}
  .exs .g{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:14.5px;color:#1d2420}
  .exs .z{font-size:12.5px;color:var(--muted);margin-top:1px}

  .box{border-radius:10px;padding:9px 12px;margin:12px 0;font-size:13.2px;line-height:1.6}
  .box.tip{background:#f0f7ee;border:1px solid #cbe3cf;color:#27573a}
  .box.warn{background:#fdf2f0;border:1px solid #eccbc5;color:#7a3830}
  .box b{font-weight:700}

  .quiz{margin:14px 0 4px;border-top:1px dashed var(--line);padding-top:12px}
  .quiz .qt{font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
  .qi{display:flex;align-items:baseline;gap:9px;padding:6px 0;flex-wrap:wrap}
  .qi .q{font-size:13.8px;flex:1;min-width:60%}
  .qi .a{font-size:13px;color:#1f6b46;background:#eef8f1;border:1px solid #c6e2d2;border-radius:6px;padding:2px 8px}
  .qi .a.wait{display:none}
  .qi .rv{border:1px solid var(--line);background:#fbf7ec;border-radius:7px;font-size:11.5px;padding:3px 8px;color:var(--muted);cursor:pointer;flex:0 0 auto}

  footer{margin-top:26px;text-align:center;color:var(--faint);font-size:12px}
  .empty{padding:30px;text-align:center;color:var(--muted)}
  @media(max-width:520px){
    .ct h2{font-size:16px}
    .cbody p{font-size:13.6px}
    table{font-size:12.4px}
  }
  @media print{
    header,.tools,.search,.mark{display:none}
    section.ch{break-inside:avoid;box-shadow:none}
    .qi .a.wait{display:inline}
  }
</style>
</head>
<body>
<header>
  <div class="hrow">
    <a class="brand" href="index.html" target="_top"><i></i>Deutsch A1 · 语法</a>
    <a class="back" href="index.html" target="_top">返回</a>
  </div>
  <div class="toc" id="toc"></div>
</header>

<main>
  <div class="hero">
    <h1>德语 A1 纯语法</h1>
    <p>20 章 · 从发音到从句语序 · 每章配例句、易错点和自测题，点“看答案”即可对答案。</p>
    <div class="prog"><div class="bar"><i id="pbar"></i></div><b id="ptext">0 / 20</b></div>
    <div class="tools">
      <button class="btn sm" id="expand">全部展开</button>
      <button class="btn sm" id="collapse">全部收起</button>
      <button class="btn sm" id="onlyTodo">只看没学的</button>
      <button class="btn sm" id="reset">重置进度</button>
    </div>
    <input class="search" id="search" type="search" placeholder="搜索语法点：如 Akkusativ、命令式、halb neun…">
  </div>
  <div id="chapters"></div>
  <footer>内容按 Netzwerk neu A1 的语法顺序整理 · 进度存在本机浏览器</footer>
</main>

<script src="grammatik-data.js"></script>
<script>
(function(){
  "use strict";
  var G = window.NW_GRAMMAR || {chapters:[]};
  var KEY = "nwa1_grammar_done_v1";
  var done = {};
  try { done = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch(e){ done = {}; }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(done)); } catch(e){} }

  var chaptersEl = document.getElementById("chapters");
  var tocEl = document.getElementById("toc");

  function el(tag, cls, txt){
    var x = document.createElement(tag);
    if(cls) x.className = cls;
    if(txt != null) x.textContent = txt;
    return x;
  }

  /* ---------- render ---------- */
  function renderBlock(b){
    if(b.t === "h") return el("h3", "", b.x);
    if(b.t === "p"){
      var p = el("p");
      // 支持 `code` 与 *强调* 的简易标记
      var parts = String(b.x).split(/(`[^`]+`|\*\*[^*]+\*\*|\n)/g);
      parts.forEach(function(seg){
        if(!seg) return;
        if(seg === "\n"){ p.appendChild(document.createElement("br")); return; }
        if(seg.charAt(0) === "`" && seg.charAt(seg.length-1) === "`"){
          p.appendChild(el("code", "", seg.slice(1,-1)));
        } else if(seg.slice(0,2) === "**" && seg.slice(-2) === "**"){
          p.appendChild(el("b", "", seg.slice(2,-2)));
        } else {
          p.appendChild(document.createTextNode(seg));
        }
      });
      return p;
    }
    if(b.t === "table"){
      var t = el("table");
      var thead = el("thead"), tr = el("tr");
      (b.head || []).forEach(function(h){ tr.appendChild(el("th", "", h)); });
      thead.appendChild(tr); t.appendChild(thead);
      var tb = el("tbody");
      (b.rows || []).forEach(function(r){
        var tr2 = el("tr");
        r.forEach(function(c){ tr2.appendChild(el("td", "", c)); });
        tb.appendChild(tr2);
      });
      t.appendChild(tb);
      return t;
    }
    if(b.t === "ex"){
      var wrap = el("div", "exs");
      (b.items || []).forEach(function(it){
        var r = el("div", "row2");
        r.appendChild(el("div", "g", it.de));
        if(it.zh) r.appendChild(el("div", "z", it.zh));
        wrap.appendChild(r);
      });
      return wrap;
    }
    if(b.t === "tip" || b.t === "warn"){
      var box = el("div", "box " + b.t);
      box.textContent = (b.t === "tip" ? "💡 " : "⚠️ ") + b.x;
      return box;
    }
    if(b.t === "quiz"){
      var q = el("div", "quiz");
      q.appendChild(el("div", "qt", "自测"));
      (b.items || []).forEach(function(it){
        var row = el("div", "qi");
        row.appendChild(el("div", "q", it.q));
        var ans = el("span", "a wait", it.a);
        var btn = el("button", "rv", "看答案");
        btn.onclick = function(){
          ans.classList.remove("wait");
          btn.style.display = "none";
        };
        row.appendChild(btn);
        row.appendChild(ans);
        q.appendChild(row);
      });
      return q;
    }
    return el("div", "", String(b.x || ""));
  }

  function renderChapter(ch){
    var sec = el("section", "ch");
    sec.id = ch.id;

    var head = el("div", "chead");
    head.appendChild(el("div", "num", String(ch.n)));
    var ct = el("div", "ct");
    ct.appendChild(el("h2", "", ch.title));
    if(ch.sub) ct.appendChild(el("div", "sub", ch.sub));
    head.appendChild(ct);

    var mk = el("button", "mark" + (done[ch.id] ? " on" : ""), done[ch.id] ? "已学 ✓" : "标记已学");
    mk.onclick = function(e){
      e.stopPropagation();
      if(done[ch.id]) delete done[ch.id]; else done[ch.id] = 1;
      save(); syncProgress();
      mk.className = "mark" + (done[ch.id] ? " on" : "");
      mk.textContent = done[ch.id] ? "已学 ✓" : "标记已学";
      var link = tocEl.querySelector('a[data-id="' + ch.id + '"]');
      if(link) link.classList.toggle("done", !!done[ch.id]);
    };
    head.appendChild(mk);

    head.onclick = function(){ sec.classList.toggle("collapsed"); };
    sec.appendChild(head);

    var body = el("div", "cbody");
    (ch.blocks || []).forEach(function(b){ body.appendChild(renderBlock(b)); });
    sec.appendChild(body);
    return sec;
  }

  function renderToc(){
    tocEl.innerHTML = "";
    G.chapters.forEach(function(ch){
      var a = el("a", done[ch.id] ? "done" : "", ch.n + ". " + ch.title);
      a.href = "#" + ch.id;
      a.setAttribute("data-id", ch.id);
      a.onclick = function(){
        var sec = document.getElementById(ch.id);
        if(sec) sec.classList.remove("collapsed");
      };
      tocEl.appendChild(a);
    });
  }

  function renderAll(){
    chaptersEl.innerHTML = "";
    G.chapters.forEach(function(ch){ chaptersEl.appendChild(renderChapter(ch)); });
    renderToc();
    syncProgress();
  }

  function syncProgress(){
    var total = G.chapters.length;
    var n = 0;
    G.chapters.forEach(function(ch){ if(done[ch.id]) n++; });
    document.getElementById("pbar").style.width = (total ? 100*n/total : 0) + "%";
    document.getElementById("ptext").textContent = n + " / " + total;
    var links = tocEl.querySelectorAll("a");
    for(var i=0;i<links.length;i++){
      var id = links[i].getAttribute("data-id");
      links[i].classList.toggle("done", !!done[id]);
    }
  }

  /* ---------- 搜索 ---------- */
  function search(q){
    q = (q || "").trim().toLowerCase();
    var shown = 0;
    G.chapters.forEach(function(ch){
      var sec = document.getElementById(ch.id);
      if(!sec) return;
      if(!q){ sec.classList.remove("hide"); shown++; return; }
      var hay = (ch.title + " " + (ch.sub||"") + " " + JSON.stringify(ch.blocks)).toLowerCase();
      var hit = hay.indexOf(q) >= 0;
      sec.classList.toggle("hide", !hit);
      if(hit) shown++;
    });
    var old = document.getElementById("nores");
    if(old) old.remove();
    if(q && shown === 0){
      var d = el("div", "empty", "没有找到「" + q + "」，换个说法试试（比如 Akkusativ、命令式、halb neun）");
      d.id = "nores";
      chaptersEl.appendChild(d);
    }
  }

  /* ---------- 按钮 ---------- */
  document.getElementById("expand").onclick = function(){
    G.chapters.forEach(function(ch){ var s = document.getElementById(ch.id); if(s) s.classList.remove("collapsed"); });
  };
  document.getElementById("collapse").onclick = function(){
    G.chapters.forEach(function(ch){ var s = document.getElementById(ch.id); if(s) s.classList.add("collapsed"); });
  };
  document.getElementById("onlyTodo").onclick = function(){
    var btn = this;
    var filtering = btn.getAttribute("data-on") !== "1";
    btn.setAttribute("data-on", filtering ? "1" : "0");
    btn.textContent = filtering ? "显示全部" : "只看没学的";
    G.chapters.forEach(function(ch){
      var s = document.getElementById(ch.id);
      if(!s) return;
      s.classList.toggle("hide", filtering && !!done[ch.id]);
    });
  };
  document.getElementById("reset").onclick = function(){
    if(!confirm("清空“已学”记录？")) return;
    done = {}; save(); renderAll();
  };
  document.getElementById("search").oninput = function(){ search(this.value); };

  /* 滚动时高亮目录 */
  var spy = null;
  if("IntersectionObserver" in window) spy = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if(!en.isIntersecting) return;
      var links = tocEl.querySelectorAll("a");
      for(var i=0;i<links.length;i++){
        links[i].classList.toggle("on", links[i].getAttribute("data-id") === en.target.id);
      }
    });
  }, {rootMargin: "-90px 0px -70% 0px"});

  renderAll();
  if(spy) G.chapters.forEach(function(ch){ var s = document.getElementById(ch.id); if(s) spy.observe(s); });
})();
</script>
</body>
</html>
